# Tests run on an in-memory H2 database (PostgreSQL mode), no Docker needed.
spring.datasource.url=jdbc:h2:mem:library_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=test-secret
app.jwt.expiration-hours=1
app.seed.enabled=true
app.maintenance.interval-ms=3600000
# Pushes are sent inline in tests so assertions can check them immediately.
app.push.async=false
app.firebase.credentials=
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
