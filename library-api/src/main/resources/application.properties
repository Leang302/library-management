spring.application.name=library-api
server.port=8081
spring.web.error.include-stacktrace=never
spring.web.error.include-path=always

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/library_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Safety net against N+1: lazy associations / collections load in batches of up to 50 ids.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ===== Swagger / OpenAPI =====
# UI available at: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===== Security (JWT) =====
# Change this secret in production.
app.jwt.secret=change-me-greenleaf-library-demo-secret-key-2026
app.jwt.expiration-hours=12

# ===== Push notifications (Firebase Cloud Messaging) =====
# Path to the Firebase service-account JSON (Firebase console > Project settings >
# Service accounts > Generate new private key). Empty = pushes are only logged.
app.firebase.credentials=${FIREBASE_CREDENTIALS:}

# ===== Demo data =====
# Seeds demo users, books and loans when the database is empty.
app.seed.enabled=true
