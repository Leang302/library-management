<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#65B874">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Greenleaf Library — mobile-first library management prototype with QR checkout and returns.">
  <title>Greenleaf Library</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2365B874'/%3E%3Cpath d='M9 9v14M13 9v14M18 10l4 13' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="stage">
    <!-- Desktop-only notes (hidden on phones) -->
    <aside class="stage-info" aria-label="Demo accounts">
      <p class="si-title">Greenleaf Library</p>
      <p class="si-sub">Prototype · iPhone 18 Pro Max preview</p>
      <ul class="si-accounts">
        <li><b>Admin</b><code>admin@library.com · admin123</code></li>
        <li><b>Librarian</b><code>librarian@library.com · library123</code></li>
        <li><b>Student</b><code>student@library.com · student123</code></li>
      </ul>
      <p class="si-hint">No camera? Use Demo tools (sign-in screen or Profile) to simulate scans.</p>
    </aside>

    <!-- The phone: iPhone 18 Pro Max frame on desktop, full screen on phones -->
    <div class="phone-slot">
      <div class="iphone">
        <span class="hw action"></span><span class="hw vol-up"></span><span class="hw vol-dn"></span>
        <span class="hw power"></span><span class="hw camctl"></span>
        <div class="device" id="device">
          <div class="statusbar" aria-hidden="true">
            <span id="sb-time">9:41</span>
            <span class="sb-island"></span>
            <span class="sb-icons">
              <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10" y="3" width="3.2" height="9" rx="1"/><rect x="15" y="0" width="3.2" height="12" rx="1"/></svg>
              <svg width="17" height="12" viewBox="0 0 15 11"><path d="M7.5 2.2c2 0 3.9.8 5.3 2.1l1.1-1.1A9 9 0 0 0 7.5.6 9 9 0 0 0 1.1 3.2l1.1 1.1A7.5 7.5 0 0 1 7.5 2.2Zm0 3.2c1.1 0 2.2.4 3 1.2l1.1-1.1a5.8 5.8 0 0 0-8.2 0l1.1 1.1c.8-.8 1.9-1.2 3-1.2Zm0 3.2c-.4 0-.8.2-1.1.5l1.1 1.1 1.1-1.1c-.3-.3-.7-.5-1.1-.5Z"/></svg>
              <svg width="28" height="13" viewBox="0 0 28 13"><rect x=".5" y=".5" width="24" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".35"/><rect x="2" y="2" width="18" height="9" rx="2.3"/><path d="M26 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".4"/></svg>
            </span>
          </div>
          <div id="app">
            <main id="view" aria-live="polite"></main>
            <nav id="tabbar" aria-label="Main navigation" hidden></nav>
          </div>
          <div id="overlay-root"></div>
          <div id="toast-root" aria-live="polite"></div>
          <!-- Launch screen: plain HTML so it paints before any script or CDN loads -->
          <div id="splash" role="status" aria-label="Loading Greenleaf Library">
            <div class="splash-mark"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg></div>
            <b class="splash-name">Greenleaf Library</b>
            <span class="splash-bar" aria-hidden="true"><i></i></span>
          </div>
          <div class="home-indicator" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Filled only while printing QR labels / receipts -->
  <div id="print-root"></div>

  <!-- Third-party libraries (pinned versions). The app degrades gracefully if any fail to load. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Core: helpers → data layer → seed → business logic -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/seed.js"></script>
  <script src="js/core/services.js"></script>
  <!-- UI framework -->
  <script src="js/ui/components.js"></script>
  <script src="js/ui/scanner.js"></script>
  <script src="js/ui/router.js"></script>
  <!-- Screens -->
  <script src="js/screens/common.js"></script>
  <script src="js/screens/student.js"></script>
  <script src="js/screens/librarian.js"></script>
  <script src="js/screens/books.js"></script>
  <script src="js/screens/admin.js"></script>
  <script src="js/screens/receipts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
